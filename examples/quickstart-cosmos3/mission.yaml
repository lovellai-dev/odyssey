# Cosmos 3 (WAM) quickstart mission (LIBERO eval-only, single-agent).
#
# Scores a Cosmos 3 world-action model on the LIBERO object suite through the
# `pilot: cosmos3` swap — the same chunk-aware LIBERO bridge GR00T and π0.5 use.
# A WAM answers one policy query with a predicted future observation video AND
# an action chunk; the chunk is replayed open-loop (buffer + replay +
# flush-on-instruction-change via the shared ChunkPilotAdapter), the video is
# ignored by the eval.
#
# EVAL-ONLY and EXTERNALLY-SERVED (π0.5 posture): start cosmos-framework's HTTP
# policy server yourself and point this mission at host:port ::
#
#     python -m cosmos_framework.scripts.action_policy_server_libero \
#         --checkpoint-path <hf-id-or-exported-model-dir> --port 8000
#
# The server owns the weights, prompt augmentation, diffusion sampling and
# action de-normalization; `config.checkpoint` below is recorded in the run
# summary but NOT loaded on the odyssey side.
#
# ⚠️ CHECKPOINT REALITY: NVIDIA publishes DROID policy checkpoints
# (Cosmos3-{Nano,Edge}-Policy-DROID) but NO LIBERO one — the paper's LIBERO-10
# numbers come from their own SFT (nvidia/LIBERO_LeRobot_v3, LeRobot format).
# Serving a DROID checkpoint here is an OUT-OF-DISTRIBUTION smoke (episodes run
# end-to-end; success is not expected). A real score needs the Cosmos3 SFT
# training runner (follow-up PR) to produce a LIBERO checkpoint first.
#
# ⚠️ UNVERIFIED ON GPU as of this PR: wire shape confirmed against the server
# source; concat_view ordering, rot6d axis order and gripper polarity are the
# things to confirm on the first smoke. Nano 16B does NOT fit an L4 24GB —
# serve it on the H100 box (Edge 4B fits smaller GPUs).

odysseyVersion: "0.1"
kind: Mission

metadata:
  name: quickstart-cosmos3-libero-object
  description: >-
    Eval-only — score a Cosmos 3 world-action model on the LIBERO object suite,
    driven out-of-process via cosmos-framework's pre-started HTTP action policy
    server. Chunk-emitting WAM pilot behind the shared chunk adapter.
  tags: [cosmos3, wam, nvidia, libero, robosuite, franka, eval-only]

objective: |
  Evaluate a Cosmos 3 policy checkpoint on the LIBERO object suite, replaying
  the emitted action chunk open-loop through the shared chunk-aware pilot
  adapter, with the model served out-of-process by cosmos-framework.

acceptance_criteria: |
  The policy server serves the checkpoint, Cosmos 3 action chunks execute in
  LIBERO, and the run reports its success_rate across the evaluation episodes
  (non-trivial only once a LIBERO-SFT checkpoint is served).

robot:
  embodiment: franka_panda
  agents:
    - id: pilot
      role: PILOT
      model:
        source: huggingface
        # Any Cosmos 3 family member — the SERVER loads the weights. The published
        # DROID policies are OOD on LIBERO (see header); swap in your own
        # LIBERO-SFT export once the training runner lands.
        base: nvidia/Cosmos3-Nano-Policy-DROID

tasks:
  - name: eval-libero-object-cosmos3
    kind: evaluation
    evaluation_type: libero
    description: Pick-and-place of the task_id=0 object (LIBERO object suite), Cosmos3 pilot.
    benchmark_name: libero_object        # LIBERO suite (spatial/object/goal/libero_10)
    num_episodes: 10
    config:
      pilot: cosmos3                      # -> cosmos3_libero_eval.py subprocess + HTTP client
      # Recorded in the summary only; the policy server (below) already holds
      # the weights (its --checkpoint-path takes a LOCAL directory: a staged
      # hf download or a cosmos_framework export_model dir).
      checkpoint: nvidia/Cosmos3-Nano-Policy-DROID
      task_id: 0                          # which task within the suite (0..9)

      # --- cosmos-framework policy server (EXTERNALLY-SERVED: pre-started by you) ---
      host: 127.0.0.1
      port: 8000                          # action_policy_server_libero default

      # --- WAM request/chunk knobs (family-wide; all optional) ---
      # n_action_steps: 16                # 0/omitted -> adopt the server's action_chunk_size (GET /info)
      # domain_name: libero               # Cosmos3 action domain tag per /predict
      # image_size: 256                   # server-side target height for the concat_view frame
      # translation_only: true            # de-risk knob: zero rotation + force gripper open

      capture_video: true                 # one MP4 per episode

leaderboard:
  publish: false   # Backend not live yet.
