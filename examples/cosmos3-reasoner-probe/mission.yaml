# Cosmos 3 Reasoner SPECIALIST probe — grasp verification (eval-only, custom
# runner, no simulator).
#
# NAMING: `nvidia/Cosmos3-Nano` (the base omnimodal model — the REASONER
# surface, 16B) is NOT `nvidia/Cosmos3-Nano-Policy-DROID` (the action policy).
# This mission probes the former as a SPECIALIST candidate in the DELEGATION
# spirit of the planner-vs-delegation experiment (PR #68, closed unmerged): the
# SPECIALIST authors no plan — it answers on-demand perception questions, the
# headline one being GRASP VERIFICATION ("is the object secured in the
# gripper?"). This is the "stronger judge" direction of issue #78 (the
# co-resident Gemma int4 check_done answered NO essentially always — the
# control question here detects exactly that degenerate mode).
#
# WHO IS WHO (nothing simulated here):
#   * SPECIALIST — nvidia/Cosmos3-Nano, served by vLLM, the ONLY agent this
#     mission exercises (via OpenAICompatCompletionJudge over HTTP).
#   * PILOT — the GR00T + FlowDAgger drug-sort policy that PRODUCED the
#     judged rollouts on the H100 (recorded for provenance; this mission never
#     loads or runs it — the spec simply requires a PILOT in the loadout).
#
# It exercises `OpenAICompatCompletionJudge` — the CompletionDetector surface a
# multi-agent mission would drop this model into — over frames sampled at
# several positions of the successful drug-sort rollouts (grasp should flip
# YES while the object is held). Metric-only: no fabricated success_rate.
# NOTE: the pick lands in the first ~15% of these episodes and the episode
# idles at the tick cap after early success — an all-NO grasp column at the
# default 0/50/75/100% positions is honest, not #78 degeneracy (see README).
#
# EXTERNALLY-SERVED — plain vLLM (NOT `--omni`!) from the vllm-omni v0.26.0
# image on a GPU box (the AR reasoning surface loads ≈ 40 GB; H100-class):
#
#     sudo docker run --rm --gpus all --network host \
#         -v ~/.cache/huggingface:/root/.cache/huggingface \
#         vllm/vllm-omni:v0.26.0 \
#         vllm serve nvidia/Cosmos3-Nano --host 0.0.0.0 --port 8002 \
#             --gpu-memory-utilization 0.60 --max-model-len 32768
#
# Under `--omni` the same chat request routes to the DIFFUSION pipeline (image
# reply, never YES/NO text → every verdict parses as the conservative NO).
# See the README for the full serving gotchas.

odysseyVersion: "0.1"
kind: Mission

metadata:
  name: cosmos3-reasoner-specialist-grasp-probe
  description: >-
    Eval-only probe of the Cosmos 3 Reasoner (Cosmos3-Nano) as a
    grasp-verification SPECIALIST — control / grasp / completion / retry
    judgements over successful drug-sort rollout frames via the
    OpenAI-compatible judge surface, delegation-style.
  tags: [cosmos3, reasoner, nvidia, specialist, grasp, delegation, judge, custom, eval-only]

objective: |
  Verify that a served Cosmos3-Nano Reasoner loads and answers the judge
  protocol, and measure whether its YES/NO verdicts track grasp state across
  rollout frames — the grounding a delegation-style SPECIALIST needs before
  any multi-agent wiring.

acceptance_criteria: |
  All judge calls succeed against the endpoint; the control question answers
  YES (no always-NO degenerate mode); grasp verdicts discriminate held-object
  frames from pre-grasp and post-place frames; per-call latency is workable
  for chunk-boundary gating.

robot:
  embodiment: ur10e   # the drug-sort DAgger rig the judged rollouts ran on
  agents:
    # PROVENANCE ONLY — the GR00T + FlowDAgger drug-sort policy (a frozen
    # GR00T flow pilot finetuned from this base, steered per the FlowDAgger
    # recipe over DAgger iterations) is what actually drove the robot in the
    # judged rollout videos, on the H100. This mission never loads or
    # executes it; the spec requires a PILOT in the loadout and this records
    # the honest one.
    - id: gr00t-flowdagger-pilot
      role: PILOT
      model:
        source: huggingface
        base: nvidia/GR00T-N1.7
    # The agent under test: the Reasoner surface, served by vLLM (see header).
    - id: specialist
      role: SPECIALIST
      model:
        source: huggingface
        base: nvidia/Cosmos3-Nano

tasks:
  # SUCCESSFUL drug-sort DAgger rollouts (UR10e campaign, which reuses
  # ur5e-drugsort tooling paths): grasp should flip YES while the object is
  # held — mind the early-grasp window (header note).
  - name: probe-grasp-success-rollouts
    kind: evaluation
    evaluation_type: custom
    description: >-
      Judge frames of successful UR-arm drug-sort DAgger rollouts through the
      endpoint serving Cosmos3-Nano — the YES polarity of grasp verification.
    benchmark_name: cosmos3_reasoner_grasp_probe
    num_episodes: 12
    config:
      eval_script: examples/cosmos3-reasoner-probe/reasoner_probe.py
      # eval_python: /path/to/env_pilot_cosmos3/bin/python   # needs imageio+pillow
      checkpoint: nvidia/Cosmos3-Nano          # recorded in the summary only
      # --- forwarded verbatim to the script (snake_case -> --flags) ---
      base_url: http://127.0.0.1:8002/v1       # the vLLM endpoint
      model: nvidia/Cosmos3-Nano               # served model id
      videos_dir: ~/cosmos3_probe_videos_success
      instruction: pick up the red capsule and place it in the blue tray
      max_videos: 3
      max_tokens: 1024
      timeout_seconds: 180
      # Issue #78 zoom lesson: the drug-sort rollouts are 256x512 concat_view —
      # crop to the wrist half (where the grasp actually is) and upscale.
      view: wrist
      upscale: 3

leaderboard:
  publish: false
