# RoboBrain 2.5 SPECIALIST probe — retry strategy (eval-only, custom runner,
# no simulator).
#
# The RoboBrain arm of the Specialist Model Map v0.5 bake-off: retry strategy
# is RoboBrain 2.5's native benchmark family (mistake existence /
# classification / recovery), challenged against the Cosmos3-Nano Reasoner
# (examples/cosmos3-reasoner-probe — same four questions VERBATIM, same rollout
# frames, so any verdict delta is the model, not the prompt or the pixels).
#
# WHO IS WHO (nothing simulated here):
#   * SPECIALIST — BAAI/RoboBrain2.5-8B-NV (Qwen3-VL-8B base, the NV spatial
#     variant), served by VANILLA vLLM, the ONLY agent this mission exercises
#     (via OpenAICompatCompletionJudge over HTTP).
#   * PILOT — the GR00T + FlowDAgger drug-sort policy that PRODUCED the judged
#     rollouts on the H100 (recorded for provenance; this mission never loads
#     or runs it — the spec simply requires a PILOT in the loadout).
#
# EXTERNALLY-SERVED — vanilla vLLM >= 0.11 (Qwen3-VL support), in its OWN venv
# (do NOT upgrade the vllm-omni env that serves Cosmos). The checkpoint is
# GATED on HF: accept the conditions on the model page and export HF_TOKEN
# (and mind HF_HUB_OFFLINE — the download needs to be online once):
#
#     vllm serve BAAI/RoboBrain2.5-8B-NV --host 0.0.0.0 --port 8002 \
#         --gpu-memory-utilization 0.60 --max-model-len 32768
#
# ~18 GB bf16 — comfortable on H100 next to the pilot. No `modalities`
# extra_body knob needed (that is a vLLM-Omni/Cosmos quirk).

odysseyVersion: "0.1"
kind: Mission

metadata:
  name: robobrain25-retry-specialist-probe
  description: >-
    Eval-only probe of RoboBrain 2.5 (8B-NV) as a retry-strategy SPECIALIST —
    control / grasp / completion / retry judgements over drug-sort rollout
    frames via the OpenAI-compatible judge surface, the RoboBrain arm of the
    Specialist Model Map v0.5 bake-off against Cosmos3-Nano.
  tags: [robobrain, baai, retry, specialist, bakeoff, judge, custom, eval-only]

objective: |
  Verify that a served RoboBrain 2.5 loads and answers the judge protocol, and
  measure whether its YES/NO verdicts track failure state across rollout
  frames — the grounding a retry-strategy SPECIALIST needs before any
  multi-agent wiring, on the same frames and questions as the Cosmos3-Nano arm.

acceptance_criteria: |
  All judge calls succeed against the endpoint; the control question answers
  YES (no always-NO degenerate mode); retry verdicts stay NO on successful
  rollouts (no false-abort mode); per-call latency is workable for
  chunk-boundary gating.

robot:
  embodiment: ur10e   # the drug-sort DAgger rig the judged rollouts ran on
  agents:
    # PROVENANCE ONLY — the GR00T + FlowDAgger drug-sort policy that drove the
    # robot in the judged rollout videos. Never loaded here.
    - id: gr00t-flowdagger-pilot
      role: PILOT
      model:
        source: huggingface
        base: nvidia/GR00T-N1.7
    # The agent under test: RoboBrain 2.5 NV, served by vanilla vLLM.
    - id: specialist
      role: SPECIALIST
      model:
        source: huggingface
        base: BAAI/RoboBrain2.5-8B-NV

tasks:
  # SUCCESSFUL drug-sort DAgger rollouts — the SAME videos the Cosmos arm ran
  # on (Runs 1-2), so the comparison is apples-to-apples. Retry polarity here
  # is the false-positive check: a good retry specialist answers NO throughout.
  - name: probe-retry-success-rollouts
    kind: evaluation
    evaluation_type: custom
    description: >-
      Judge frames of successful UR-arm drug-sort DAgger rollouts through the
      endpoint serving RoboBrain 2.5 — retry must stay NO on success.
    benchmark_name: robobrain25_retry_probe
    num_episodes: 12
    config:
      eval_script: examples/robobrain-retry-probe/robobrain_probe.py
      # eval_python: /path/to/env_probe/bin/python   # needs imageio+pillow
      checkpoint: BAAI/RoboBrain2.5-8B-NV      # recorded in the summary only
      # --- forwarded verbatim to the script (snake_case -> --flags) ---
      base_url: http://127.0.0.1:8002/v1       # the vanilla vLLM endpoint
      model: BAAI/RoboBrain2.5-8B-NV           # served model id
      videos_dir: ~/cosmos3_probe_videos_success
      instruction: pick up the red capsule and place it in the blue tray
      max_videos: 3
      max_tokens: 1024
      timeout_seconds: 180
      # Match Cosmos Run 2 exactly (view: wrist, upscale: 3) for the
      # apples-to-apples read. The Specialist Map argues retry wants workspace
      # geometry, not the gripper close-up — that is the `view: side` follow-up
      # run, after the matched one.
      view: wrist
      upscale: 3

  # RETRY'S YES POLARITY needs FAILED rollouts (the map's C3b oracle test).
  # Enable once a failed-rollout dir is collected on the box (the earlier
  # failed-LIBERO companion mission lives on cosmos3-integration for
  # reference).
  # - name: probe-retry-failed-rollouts
  #   kind: evaluation
  #   evaluation_type: custom
  #   description: >-
  #     Judge frames of FAILED drug-sort rollouts — retry should flip YES late.
  #   benchmark_name: robobrain25_retry_probe_failed
  #   num_episodes: 12
  #   config:
  #     eval_script: examples/robobrain-retry-probe/robobrain_probe.py
  #     checkpoint: BAAI/RoboBrain2.5-8B-NV
  #     base_url: http://127.0.0.1:8002/v1
  #     model: BAAI/RoboBrain2.5-8B-NV
  #     videos_dir: ~/drugsort_probe_videos_failed
  #     instruction: pick up the red capsule and place it in the blue tray
  #     max_videos: 3
  #     max_tokens: 1024
  #     timeout_seconds: 180
  #     view: wrist
  #     upscale: 3

leaderboard:
  publish: false
