odysseyVersion: "0.1"
kind: Mission

metadata:
  name: franka-libero-gr00t-object-t1-5ep
  description: >-
    Eval-only — score the NVIDIA GR00T-N1.7 LIBERO checkpoint on libero_object
    task_id 1 over 5 episodes, capturing one rollout video per episode. task_id 0
    was already validated (10/10); this extends coverage to the next task.
  tags: [gr00t, nvidia, libero, robosuite, franka, eval-only]

objective: |
  Evaluate GR00T-N1.7 on libero_object task 1 (5 episodes) and confirm a real
  success rate, capturing per-episode rollout videos.

acceptance_criteria: |
  The GR00T server serves the checkpoint, action chunks execute in LIBERO across
  5 episodes, success_rate is reported, and one mp4 per episode is written.

robot:
  embodiment: franka_panda
  agents:
    - id: pilot
      role: PILOT
      model:
        source: huggingface
        base: nvidia/GR00T-N1.7-LIBERO

tasks:
  - name: eval-libero-object-t1-5ep
    kind: evaluation
    evaluation_type: libero
    description: Pick-and-place of the task_id=1 object (LIBERO object suite), GR00T pilot.
    benchmark_name: libero_object
    num_episodes: 5
    config:
      pilot: gr00t                           # -> gr00t_libero_eval.py subprocess + policy server
      checkpoint: nvidia/GR00T-N1.7-LIBERO   # server loads the <suite> subdir (libero_object/)
      task_id: 1                             # <- task 1 (task 0 already validated 10/10)

      # --- GR00T policy server (closed-loop auto-serve) ---
      serve_checkpoint: true
      embodiment_tag: LIBERO_PANDA
      sim_policy_wrapper: true
      port: 5555
      server_python: /home/gema/Isaac-GR00T/.venv/bin/python

      # --- action chunk (LIBERO action is ABSOLUTE 7-DoF; no pos/rot scaling) ---
      n_action_steps: 16

      # one mp4 per episode -> <run_output_dir>/videos/episode_NN_{PASS,FAIL}.mp4
      # (upright: agentview is flipped 180°; encoded mp4 @ 24 fps by the runner).
      capture_video: true
