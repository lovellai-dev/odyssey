odysseyVersion: "0.1"
kind: Mission

metadata:
  name: franka-libero-gr00t-orchestration
  description: >-
    Multi-agent eval, ORCHESTRATION arm (regime D) — a GR00T-N1.7 PILOT driven by
    an LLM ORCHESTRATOR (Gemma) that decides the next sub-instruction DYNAMICALLY.
    Unlike the planner arm (plan up front) or the delegation arm (fixed pick->place
    template), here the orchestrator looks at the live scene + what's already done
    and routes the next atomic sub-task, or declares the task DONE. The
    orchestrator reuses the same Gemma for `route` + `check_done` — zero extra VRAM.
  tags: [gr00t, nvidia, libero, robosuite, franka, multi-agent, orchestration, eval-only]

objective: |
  Evaluate GR00T-N1.7 on LIBERO object with an LLM orchestrator that decides the
  sub-task sequence dynamically (regime D), for comparison against the planner and
  delegation arms.

acceptance_criteria: |
  The GR00T server serves the checkpoint, the ORCHESTRATOR routes sub-instructions
  + gates hand-back, chunks execute in LIBERO, and the run reports a non-trivial
  success_rate.

robot:
  embodiment: franka_panda
  agents:
    - id: pilot
      role: PILOT
      model:
        source: huggingface
        base: nvidia/GR00T-N1.7-LIBERO
    - id: router
      role: ORCHESTRATOR
      model:
        source: huggingface
        base: google/gemma-4-E2B-it
        quantization: int4
        modality: multimodal        # sees the frame to route + check completion

tasks:
  - name: eval-libero-object-gr00t-orchestration
    kind: evaluation
    evaluation_type: libero
    description: Orchestrated pick-and-place of task_id=0 (LIBERO object), GR00T pilot.
    benchmark_name: libero_object
    num_episodes: 10
    config:
      pilot: gr00t                      # -> gr00t_libero_eval.py + GR00T policy server
      checkpoint: nvidia/GR00T-N1.7-LIBERO
      task_id: 0

      # --- multi-agent coordination: ORCHESTRATION (LLM routes the sequence) ---
      coordination: orchestration       # regime D: LLM router decides next sub-task
      phase_check_every: 10             # poll the completion check every N steps
      phase_max_steps: 100              # safety cap so a phase never wedges
      max_phases: 8                     # cap on routed sub-tasks per episode
      # NOTE: run with ODYSSEY_SPECIALIST_PYTHON set (the Gemma venv).

      # --- GR00T policy server (closed-loop auto-serve) ---
      serve_checkpoint: true
      embodiment_tag: LIBERO_PANDA
      sim_policy_wrapper: true
      port: 5555

      # --- action chunk (LIBERO action is ABSOLUTE 7-DoF; no pos/rot scaling) ---
      n_action_steps: 16

      capture_video: true
