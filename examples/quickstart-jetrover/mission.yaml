# JetRover quickstart mission — real-hardware 6DoF arm.
#
# Fine-tunes GR00T N1.7 (3B) as a NEW_EMBODIMENT on a LeRobot-format
# teleoperation dataset captured on the Hiwonder JetRover's 6DoF arm, then
# evaluates the resulting policy ON THE REAL ARM via `evaluation_type: custom`
# (the built-in Robosuite/LIBERO/Isaac evals are sim-only and ship no JetRover
# model). See README.md in this directory for the end-to-end recipe.
#
# Validate without a GPU or the robot:
#   odyssey validate mission.yaml
#   odyssey run mission.yaml --use-mock-runner

odysseyVersion: "0.1"
kind: Mission

metadata:
  name: jetrover-arm-pick
  description: >-
    GR00T N1.7 NEW_EMBODIMENT fine-tune on JetRover 6DoF-arm LeRobot demos,
    evaluated closed-loop on the real arm with operator scoring.
  tags: [quickstart, jetrover, hiwonder, gr00t, lerobot, real-hardware]

objective: |
  Fine-tune the GR00T N1.7 3B foundation model on ~50 teleoperated
  pick-and-place demonstrations recorded on the JetRover's 6DoF arm, so the
  policy can pick up the target object on the physical robot.

acceptance_criteria: |
  At least 3 operator-confirmed successful picks across 10 evaluation
  episodes on the real arm.

robot:
  # jetrover is a registered embodiment: GR00T NEW_EMBODIMENT finetune +
  # real-hardware custom eval — Robosuite eval tasks refuse it loudly.
  embodiment: jetrover
  agents:
    - id: pilot
      role: PILOT
      model:
        source: huggingface
        base: nvidia/GR00T-N1.7-3B

tasks:
  - name: finetune-gr00t-jetrover
    kind: training
    training_type: demonstration
    agent_id: pilot
    dataset:
      source: local
      # ABSOLUTE path to the captured dataset ON THE TRAINING BOX (GPU VM).
      # LeRobot v2 layout + meta/modality.json with the jetrover keys
      # (state/action.single_arm 6-D + .gripper 1-D, video.front) — see README.
      ref: /data/jetrover_pick_v0/jetrover_pick
      format: lerobot
    config:
      # Routes this wildcard training task to the GR00T runner explicitly.
      runner: gr00t
      # Remaining keys mirror gr00t/experiment/launch_finetune.py flags
      # (underscores become dashes on the CLI).
      embodiment_tag: new_embodiment
      # Copy jetrover_modality_config.py (this directory) into your Isaac-GR00T
      # checkout at this path; relative paths resolve against
      # $ISAAC_GR00T_REPO_PATH.
      modality_config_path: examples/JETROVER/jetrover_config.py
      # Small-data knobs for a ~50-episode set — tune per GPU.
      global_batch_size: 32
      max_steps: 2000

  # Closed-loop eval ON THE REAL ARM. The script connects to a pre-started
  # GR00T policy server (serve the finetuned checkpoint on the GPU box) and
  # drives the arm over ROS 2; the operator confirms success per episode.
  - name: eval-jetrover-real-arm
    kind: evaluation
    evaluation_type: custom
    benchmark_name: jetrover-real-arm
    num_episodes: 10
    config:
      # Resolved relative to the odyssey working directory.
      eval_script: examples/quickstart-jetrover/eval_jetrover.py
      # NOTE: num_episodes must be repeated here — the runner deliberately
      # forwards only config.* keys to the script, never task-level fields.
      num_episodes: 10
      arm_backend: ros2          # mock | ros2 | hiwonder
      policy_backend: zmq        # zmq (GR00T server) | mock
      policy_host: 192.168.1.100 # the GPU box serving the checkpoint
      policy_port: 5555
      task_description: "pick up the object"
      scorer: operator           # y/n prompt per episode; `none` = metric-only
      max_steps: 300
      control_hz: 5
      max_joint_delta: 0.15      # rad/step safety clamp

leaderboard:
  publish: false   # Backend not live yet.

graph:
  contribute: false   # Backend not live yet.
