# Cosmos 3 (WAM) × RoboLab mission (eval-only, published DROID policy).
#
# Scores a published Cosmos 3 world-action policy (Cosmos3-Nano-Policy-DROID or
# Cosmos3-Edge-Policy-DROID) on NVlabs/RoboLab — the Isaac Lab-based simulation
# twin of the DROID rig (Franka + dual mounted cameras, tabletop tasks) NVIDIA
# evaluates these checkpoints on. First-class `evaluation_type: robolab`: the
# RobolabRunner launches RoboLab's policies/cosmos3/run.py headless, then
# scores its episode_results.jsonl into the standard eval summary.
#
# EXTERNALLY-SERVED (two processes you start first — see README.md / setup.sh):
#   1. cosmos-framework policy server (WebSocket; holds the weights):
#        python -m cosmos_framework.scripts.action_policy_server_robolab \
#            --checkpoint-path ~/checkpoints/Cosmos3-Nano-Policy-DROID --port 8000
#      (--checkpoint-path takes a LOCAL dir — stage it with `hf download` first;
#       setup.sh does this for you. Edge additionally needs
#       --format-prompt-as-json True. Guardrails are gated — see setup.sh.)
#   2. RoboLab checkout with its Isaac Sim env/docker (config.robolab_root /
#      config.eval_python below).

odysseyVersion: "0.1"
kind: Mission

metadata:
  name: cosmos3-robolab-droid
  description: >-
    Eval-only — score a published Cosmos 3 DROID world-action policy on the
    RoboLab simulation benchmark (first-class robolab runner), served
    out-of-process by cosmos-framework's action policy server.
  tags: [cosmos3, wam, nvidia, robolab, droid, isaac, eval-only]

objective: |
  Evaluate a published Cosmos 3 DROID policy checkpoint on RoboLab tasks and
  record a real success rate in the mission summary, with the policy served
  out-of-process by cosmos-framework.

acceptance_criteria: |
  The policy server serves the checkpoint, RoboLab rollouts complete headless,
  and the run reports a success_rate scored from episode_results.jsonl.

robot:
  embodiment: franka_panda   # DROID rig; documentation of the pilot identity only.
  agents:
    - id: pilot
      role: PILOT
      model:
        source: huggingface
        # Any Cosmos 3 family policy member works — the SERVER loads the weights;
        # swap to nvidia/Cosmos3-Edge-Policy-DROID (+ JSON prompt flag) for Edge.
        base: nvidia/Cosmos3-Nano-Policy-DROID

tasks:
  - name: eval-robolab-cosmos3
    kind: evaluation
    evaluation_type: robolab
    description: RoboLab rollouts against a pre-started Cosmos3 policy server.
    benchmark_name: BananaInBowlTask     # RoboLab task name (run.py --task)
    num_episodes: 10                     # -> --num-runs ceil(episodes / num_envs)
    config:
      robolab_root: /path/to/RoboLab     # the NVlabs/RoboLab checkout
      # eval_python: /path/to/robolab/env/bin/python   # Isaac Sim interpreter
      checkpoint: nvidia/Cosmos3-Nano-Policy-DROID     # recorded in the summary
      num_envs: 10                       # parallel Isaac envs per run
      # --- forwarded to run.py (underscores become dashes) ---
      remote_host: 127.0.0.1             # the policy server address
      remote_port: 8000
      # entry_script: policies/cosmos3/run.py   # RoboLab policy backend (default)
      # instruction_type: default
      # video_mode: all

leaderboard:
  publish: false   # Backend not live yet.
